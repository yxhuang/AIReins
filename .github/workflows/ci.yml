name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Check privacy in incoming commits
        env:
          PRIVACY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRIVACY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        # New branches and tags report an all-zero before; force pushes may name an unfetched one. Compare those to the default branch, not the root.
        run: |
          if [ -z "${PRIVACY_BASE//0/}" ] || ! git cat-file -e "$PRIVACY_BASE^{commit}" 2>/dev/null; then PRIVACY_BASE="origin/$DEFAULT_BRANCH"; fi
          node scripts/check-privacy.mjs --range "$PRIVACY_BASE..$PRIVACY_HEAD"
      - name: Install file-search dependency
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            command -v rg >/dev/null || brew install ripgrep
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      # macOS 的 TMPDIR 经软链（/var → /private/var），会触发读文件处的 realpath 守卫；测试用真实路径。
      - name: Resolve macOS TMPDIR
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$(cd -P "$TMPDIR" && pwd)/" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:hosts
      - run: node deploy/windows/tests/install-remote.test.mjs
      - run: npm run typecheck && npm run typecheck:frontend && npm run check:theme && npm run check:i18n && npm run check:privacy
      - run: bash -n bin/aireins install.sh
      - run: node scripts/ci-smoke.mjs
